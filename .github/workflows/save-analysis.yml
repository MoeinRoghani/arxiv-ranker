name: Save Analysis

on:
  workflow_dispatch:
    inputs:
      arxiv_id:
        description: "arXiv paper ID"
        required: true
      paper_title:
        description: "Paper title"
        required: true
      summary:
        description: "Generated AI summary text"
        required: true

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save summary
        run: |
          mkdir -p site/public/data/summaries

          cat > "site/public/data/summaries/${{ inputs.arxiv_id }}.json" << 'SUMMARY_EOF'
          {
            "arXiv_ID": "${{ inputs.arxiv_id }}",
            "paper_title": "${{ inputs.paper_title }}",
            "summary": ${{ toJSON(inputs.summary) }},
            "generated_at": "${{ github.event.repository.updated_at }}"
          }
          SUMMARY_EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/public/data/summaries/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Save analysis for ${{ inputs.arxiv_id }}"
          git push
